<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>კონტაქტი — შენი აკადემია</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="logo">NE</div>
        <div>
          <div style="font-size:14px;color:var(--muted)">NewEra Academy</div>
          <div style="font-size:12px;color:var(--muted)">გაიგე მეტი, ნახე შედეგი</div>
        </div>
      </div>
      <nav class="nav">
        <a href="index.html">მთავარი</a>
        <a href="about.html">ჩვენ შესახებ</a>
        <a href="services.html">სერვისი</a>
        <a href="contact.html">კონტაქტი</a>
      </nav>
    </header>

    <section class="card">
      <h2>დაგვიკავშირდით</h2>
      <p class="muted">გამოგვიგზავნე მოთხოვნა და ჩვენ გიპასუხებთ რაც შეიძლება მალე.</p>
      <form action="#" method="post" style="margin-top:12px;display:grid;gap:10px">
        <input name="name" placeholder="სახელი">
        <input name="email" placeholder="ელ.ფოსტა">
        <textarea name="message" placeholder="ჩემი შეტყობინება" rows="5"></textarea>
        <button type="submit" class="course-buy">გაგზავნა</button>
      </form>
    </section>

    <footer class="footer">
      © 2025 NewEra Academy — ყველა უფლება დაცულია
    </footer>
  </div>
</body>
</html>
